<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歐遊紀事 · 簡易檢視</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, system-ui, sans-serif;
  background: #f5f5f5;
  padding: 16px;
  font-size: 15px;
  line-height: 1.5;
}
h1 { font-size: 20px; margin-bottom: 16px; }
.btn {
  display: block; width: 100%;
  background: #FF6B3D; color: white;
  border: none; padding: 14px;
  border-radius: 8px; font-size: 16px; font-weight: 600;
  margin-bottom: 12px; cursor: pointer;
}
.btn:active { opacity: 0.7; }
.status {
  background: #fff3cd; padding: 10px;
  border-radius: 8px; margin-bottom: 12px;
  font-size: 13px; color: #856404;
}
.record {
  background: white; padding: 14px;
  border-radius: 8px; margin-bottom: 10px;
  border-left: 4px solid #FF6B3D;
}
.record.fee { border-left-color: #999; opacity: 0.6; }
.r-date { font-size: 12px; color: #666; }
.r-cat { display: inline-block; background: #FFE4D0; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-right: 6px; }
.r-amt { font-weight: 700; font-size: 16px; color: #FF6B3D; }
.r-note { margin-top: 6px; }
.raw {
  background: #000; color: #0f0;
  font-family: monospace; font-size: 11px;
  padding: 10px; border-radius: 8px;
  margin-top: 16px; white-space: pre-wrap;
  word-break: break-all; overflow-x: auto;
}
</style>
</head>
<body>

<h1>📋 歐遊紀事 · 簡易檢視</h1>

<div class="status" id="status">準備中...</div>

<button class="btn" onclick="load()">🔄 重新載入所有記錄</button>

<div id="results"></div>

<details style="margin-top: 16px;">
  <summary style="cursor: pointer; padding: 8px;">🩺 顯示原始 API 回應</summary>
  <div class="raw" id="raw">點上方按鈕後會顯示</div>
</details>

<script>
var API = 'https://script.google.com/macros/s/AKfycbyxf9rG4l4uTwVKyH_gK33vOglTDzo92hcOSgswO7r4MbFKjexnqD9q1WUChBAeBH35PA/exec';

function load() {
  var status = document.getElementById('status');
  var results = document.getElementById('results');
  var raw = document.getElementById('raw');

  status.textContent = '⏳ 載入中...';
  results.innerHTML = '';

  fetch(API + '?action=getAllRecords&_t=' + Date.now(), { cache: 'no-store' })
    .then(function(r) { return r.json(); })
    .then(function(j) {
      raw.textContent = JSON.stringify(j, null, 2);

      if (!j.ok) {
        status.textContent = '❌ API 錯誤：' + j.error;
        status.style.background = '#f8d7da';
        return;
      }

      var records = j.data || [];
      status.textContent = '✓ 成功載入 ' + records.length + ' 筆記錄';
      status.style.background = '#d4edda';
      status.style.color = '#155724';

      if (records.length === 0) {
        results.innerHTML = '<div class="record">Sheet 是空的</div>';
        return;
      }

      var html = '';
      records.forEach(function(r) {
        var isFee = String(r.category || '').trim() === '手續費';
        html += '<div class="record' + (isFee ? ' fee' : '') + '">'
          + '<div class="r-date">' + r.date + ' · ' + r.city + '</div>'
          + '<div style="margin-top:6px;">'
          + '<span class="r-cat">' + (r.category || '?') + '</span>'
          + '<span class="r-amt">€' + (r.amountEUR || 0) + '</span>'
          + (r.payment ? ' · ' + r.payment : '')
          + '</div>'
          + (r.note ? '<div class="r-note">' + r.note + '</div>' : '')
          + '</div>';
      });
      results.innerHTML = html;
    })
    .catch(function(err) {
      status.textContent = '❌ 連線失敗：' + err.message;
      status.style.background = '#f8d7da';
      raw.textContent = err.message;
    });
}

load();
</script>

</body>
</html>
